<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance - AlgoTrading</title>
    <link rel="stylesheet" href="/resources/css/main.css">
    <style>
        .total-section {
            margin-bottom: 30px;
        }

        .total-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .symbol-section {
            margin-bottom: 28px;
        }

        .symbol-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .stat-header {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .stat-item {
            background: #111111;
            padding: 14px;
            transition: 0.15s;
        }

        .stat-item:hover {
            background: #1c1c1c;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            font-family: monospace;
        }

        .positive {
            color: #00e676;
        }

        .negative {
            color: #ff5252;
        }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .summary-item {
            background: #111111;
            padding: 14px;
        }

        .win-loss-bar {
            height: 5px;
            background: #2a2a2a;
            overflow: hidden;
            margin: 6px 0;
        }

        .win-bar {
            height: 100%;
            background: #00e676;
            float: left;
        }

        .loss-bar {
            height: 100%;
            background: #ff5252;
            float: left;
        }

        .small-text {
            font-size: 10px;
            color: #666;
        }

        @media (max-width: 1024px) {
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stat-grid {
                grid-template-columns: 1fr;
            }

            .summary-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="sidebar-container"></div>
        
        <div id="header-container" data-title="Performance Statistics"></div>
        
        <main class="main-content">
            <div id="performance-container">
            </div>
        </main>
    </div>

    <script src="/resources/javascript/components.js"></script>
    <script src="/resources/javascript/performance.js"></script>
</body>
</html>
