<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts - AlgoTrading</title>
    <link rel="stylesheet" href="/resources/css/main.css">
    <style>
        #chart-container canvas {
            display: block !important;
        }

        .tv-lightweight-charts {
            width: 100% !important;
            height: 100% !important;
        }

        .control {
            padding: 4px 8px;
            border: 1px solid #555;
            background: #2a2e39;
            color: #d1d4dc;
            font-size: 12px;
            height: 26px;
            outline: none;
        }

        .control-button {
            background: #00C853;
            color: white;
            border: none;
            cursor: pointer;
        }

        .control-button:hover {
            opacity: 0.9;
        }

        #analytics-dropdown input[type="checkbox"] {
            margin-right: 5px;
        }

        #analytics-dropdown label {
            cursor: pointer;
            margin-bottom: 5px;
        }

        #analytics-btn {
            background: #2a2e39;
            color: #d1d4dc;
            border: 1px solid #555;
        }

        #analytics-btn:hover {
            background: #3a3e49;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="sidebar-container"></div>

        <div id="header-container" data-title="Trading Charts"></div>

        <main class="main-content">
            <div class="card" style="height: calc(100vh - 30px); display: flex; flex-direction: column;">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px;">

                    <h3 style="margin: 0; color: #d1d4dc;">OHLC Chart</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 5px; position: relative;">
                            <button id="analytics-btn" class="control control-button" style="background: #2a2e39; border: 1px solid #555;">Analytics ▼</button>
                            <div id="analytics-dropdown" style="display: none; position: absolute; top: 30px; left: 0; background: #2a2e39; border: 1px solid #555; padding: 8px; z-index: 10; min-width: 160px;">
                                <label style="display: block; color: #d1d4dc; font-size: 12px; margin-bottom: 4px; cursor: pointer;">
                                    <input type="checkbox" id="market-structure-checkbox"> Market Structure
                                </label>
                                <label style="display: block; color: #d1d4dc; font-size: 12px; margin-bottom: 4px; cursor: pointer;">
                                    <input type="checkbox" id="swing-detection-checkbox"> Swing Detection
                                </label>
                                <label style="display: block; color: #d1d4dc; font-size: 12px; margin-bottom: 4px; cursor: pointer;">
                                    <input type="checkbox" id="position-history-checkbox"> Position History
                                </label>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 14px; color: #d1d4dc; font-weight: 500;">Timeframe:</label>
                            <select id="timeframe-select" class="control">
                                <option value="M1">M1</option>
                                <option value="M5">M5</option>
                                <option value="M15">M15</option>
                                <option value="H1">H1</option>
                            </select>
                        </div>

                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 14px; color: #d1d4dc; font-weight: 500;">Symbol:</label>
                            <input type="text" id="symbol-input" value="USDJPYm" class="control" style="width: 80px; text-align: center;">
                        </div>

                        <button id="reload-btn" class="control control-button">
                            Reload
                        </button>
                    </div>
                </div>
                <div id="chart-container" style="width: 100%; flex: 1; min-height: 400px; position: relative; background: #1a1a1a;"></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        window.addEventListener('load', function () {
            if (typeof LightweightCharts === 'undefined') {
                console.error('LightweightCharts library failed to load');
            } else {
                console.log('LightweightCharts loaded successfully');
            }
        });
    </script>
    <script src="/resources/javascript/components.js"></script>
    <script type="module" src="/resources/javascript/charts/index.js"></script>
</body>

</html>
