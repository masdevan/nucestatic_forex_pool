<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - AlgoTrading</title>
    <link rel="stylesheet" href="/resources/css/main.css">
</head>
<body>
    <div class="container">
        <div id="sidebar-container"></div>
        
        <div id="header-container" data-title="Market News"></div>
        
        <main class="main-content">
            <div class="card">
                <h3 class="card-title">Today's News</h3>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 10%">Time</th>
                                <th style="width: 20%">Title</th>
                                <th>Description</th>
                                <th style="width: 6%">Status</th>
                                <th style="width: 6%">Score</th>
                                <th style="width: 12%">Pair Impact</th>
                                <th style="width: 8%">Direction</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody id="news-today-table">
                            <tr><td colspan="8" class="loading">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card">
                <h3 class="card-title">All News</h3>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 10%">Time</th>
                                <th style="width: 20%">Title</th>
                                <th>Description</th>
                                <th style="width: 6%">Status</th>
                                <th style="width: 6%">Score</th>
                                <th style="width: 12%">Pair Impact</th>
                                <th style="width: 8%">Direction</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody id="news-table">
                            <tr><td colspan="8" class="loading">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>
    
    <script src="/resources/javascript/components.js"></script>
    <script src="/resources/javascript/news.js"></script>

    <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000;" onclick="closeModal(event)">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 20px; border-radius: 8px; max-width: 80%; max-height: 80%; overflow: auto;">
            <h3 id="modal-title" style="color: #fff; margin-bottom: 10px;"></h3>
            <pre id="modal-content" style="color: #ddd; white-space: pre-wrap; word-wrap: break-word; font-size: 12px;"></pre>
            <button onclick="document.getElementById('modal-overlay').style.display='none'" style="margin-top: 10px; padding: 8px 16px; background: #444; color: #fff; border: none; cursor: pointer;">Close</button>
        </div>
    </div>
</body>
</html>
