<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header id="header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-toggle" aria-label="Menu">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                </svg>
            </button>
            <a href="/" class="home-link" title="Dashboard">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
                </svg>
            </a>
            <span class="brand">MARKET POOL</span>
        </div>
    </header>

    <div id="overlay" class="overlay"></div>

    <div id="layout">
        <aside id="sidebar">
            <div class="sidebar-container">
                <ul id="symbol-list" class="skeleton-list">
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                </ul>
            </div>
        </aside>

        <main id="content">
            <div class="tabs">
                <button class="tab active" data-tab="details">Details</button>
                <button class="tab" data-tab="m1">M1</button>
                <button class="tab" data-tab="m5">M5</button>
                <button class="tab" data-tab="m15">M15</button>
                <button class="tab" data-tab="m30">M30</button>
                <button class="tab" data-tab="h1">H1</button>
                <button class="tab" data-tab="h4">H4</button>
                <button class="tab" data-tab="d1">D1</button>
                <button class="tab" data-tab="w1">W1</button>
                <button class="tab" data-tab="mn1">MN1</button>
            </div>
            <div id="tab-content">
                <div id="tab-details" class="tab-panel active"></div>
                <div id="tab-m1" class="tab-panel"></div>
                <div id="tab-m5" class="tab-panel"></div>
                <div id="tab-m15" class="tab-panel"></div>
                <div id="tab-m30" class="tab-panel"></div>
                <div id="tab-h1" class="tab-panel"></div>
                <div id="tab-h4" class="tab-panel"></div>
                <div id="tab-d1" class="tab-panel"></div>
                <div id="tab-w1" class="tab-panel"></div>
                <div id="tab-mn1" class="tab-panel"></div>
            </div>
        </main>
    </div>

    <script src="/javascript/script.js"></script>
    <script src="/javascript/symbol.js"></script>
</body>
</html>
