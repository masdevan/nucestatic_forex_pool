<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header id="header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-toggle" aria-label="Menu">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                </svg>
            </button>
            <a href="/" class="home-link" title="Dashboard">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
                </svg>
            </a>
            <span class="brand">MARKET POOL</span>
        </div>
        <span id="mt5">
            <span class="dot skeleton"></span>
            <span class="label skeleton skeleton-text"></span>
        </span>
    </header>

    <div id="overlay" class="overlay"></div>

    <div id="layout">
        <aside id="sidebar">
            <div class="sidebar-container">
                <ul id="symbol-list" class="skeleton-list">
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                </ul>
            </div>
        </aside>

        <main id="content">
            <div id="chart-range" class="chart-range"></div>
        </main>
    </div>

    <script src="/javascript/script.js"></script>
    <script>
        (function () {
            const parts = window.location.pathname.split('/').filter(Boolean);
            if (parts.length >= 2) {
                const name = decodeURIComponent(parts[0]);
                const server = decodeURIComponent(parts[1]);

                fetch('/api/symbols/' + encodeURIComponent(name) + '/range')
                    .then(r => r.json())
                    .then(data => {
                        const el = document.getElementById('chart-range');
                        if (!data.ranges || data.ranges.length === 0) {
                            el.innerHTML = '<p class="range-empty">Belum ada data chart.</p>';
                            return;
                        }
                        let html = '<table class="range-table"><tr><th>Timeframe</th><th>Data pertama</th><th>Data terakhir</th><th>Jumlah</th></tr>';
                        data.ranges.forEach(rg => {
                            html += '<tr><td>' + rg.timeframe + '</td><td>' + rg.first +
                                '</td><td>' + rg.last + '</td><td>' + rg.count + '</td></tr>';
                        });
                        html += '</table>';
                        el.innerHTML = html;
                    })
                    .catch(() => {
                        document.getElementById('chart-range').innerHTML = '<p class="range-empty">Gagal memuat.</p>';
                    });
            }
        })();
    </script>
</body>
</html>
