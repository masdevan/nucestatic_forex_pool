<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header id="header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-toggle" aria-label="Menu">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                </svg>
            </button>
            <a href="/" class="home-link active" title="Dashboard">
                <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
                </svg>
            </a>
            <span class="brand">MARKET POOL</span>
        </div>
    </header>

    <div id="overlay" class="overlay"></div>

    <div id="layout">
        <aside id="sidebar">
            <div class="sidebar-container">
                <ul id="symbol-list" class="skeleton-list">
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                    <li class="skeleton skeleton-row"></li>
                </ul>
            </div>
        </aside>

        <main id="content">
            <div class="api-section">
                <h2>Endpoints</h2>
                <div class="api-endpoint-list">
                    <div class="api-endpoint-item" data-ep="health">
                        <span class="method get">GET</span>
                        /api/health
                        <span class="api-params-inline">-</span>
                    </div>
                    <div class="api-endpoint-item" data-ep="symbols">
                        <span class="method get">GET</span>
                        /api/symbols
                        <span class="api-params-inline">-</span>
                    </div>
                    <div class="api-endpoint-item" data-ep="range">
                        <span class="method get">GET</span>
                        /api/symbols/{symbol}/range
                        <span class="api-params-inline">symbol</span>
                    </div>
                    <div class="api-endpoint-item" data-ep="date-range">
                        <span class="method get">GET</span>
                        /api/symbols/{symbol}/date-range
                        <span class="api-params-inline">symbol</span>
                    </div>
                    <div class="api-endpoint-item" data-ep="ohlc">
                        <span class="method get">GET</span>
                        /api/ohlc/{timeframe}
                        <span class="api-params-inline">symbol, page, limit</span>
                    </div>
                </div>

                <h2>Tester</h2>
                <div class="tester-box">
                    <div class="tester-url" id="api-url">-</div>
                    <div id="api-params"></div>
                    <button id="api-run" class="btn-run">Run</button>
                    <div id="api-result" class="api-result"></div>
                </div>

                <h2>WebSocket</h2>
                <div class="ws-section">
                    <div class="ws-header">
                        <span id="ws-status" class="ws-badge ws-disconnected">Disconnected</span>
                        <button id="ws-connect" class="btn-run">Connect</button>
                    </div>
                    <div class="ws-sub-label">Active: <span id="active-subs">None</span></div>
                    <div class="tester-box">
                        <div class="tester-row">
                            <label>Channel</label>
                            <input id="ws-channel" value="trade:EURUSDm" placeholder="trade:EURUSDm">
                        </div>
                        <div class="ws-actions">
                            <button id="ws-sub-btn" class="btn-run">Subscribe</button>
                            <button id="ws-unsub-btn" class="btn-unsub">Unsubscribe</button>
                        </div>
                    </div>
                    <div id="ws-result" class="api-result"></div>
                    <div id="ws-publish-section" class="tester-box" style="display:none">
                        <h3>Publish ke <span id="ws-pub-channel"></span></h3>
                        <textarea id="ws-pub-input" class="ws-pub-input" rows="8"></textarea>
                        <button id="ws-pub-btn" class="btn-run" style="margin-top:8px">Publish</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/centrifuge@5.7.0/dist/centrifuge.js"></script>
    <script src="/javascript/script.js"></script>
    <script src="/javascript/centrifugo.js"></script>
</body>
</html>
